<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Recrutamento online</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <header>
            <h1>Recrutamento online</h1>
        </header>
        <main>
            <section>
                <h2>Cadastre seu curriculo</h2>
                <form action="https://postman-echo.com/post" method="post" enctype="multipart/form-data">
                    <p>Preencha o formulário abaixo para se candidatar à vaga</p>
                    <fieldset>
                        <legend>Dados pessoais</legend>
                        <div>
                            <label for="foto_id">Foto:</label>
                           <input id="foto_id" name="foto" type="file" accecpt="image/*"> 
                        </div>
                    <div> 
                        <label for="nome_id">Nome completo:</label>
                        <input name="nome" type="text" placeholder="Beatriz Monteiro">
                    </div> 
                    <div>  
                        <label for="telefone_id">Telefone:</label>
                        <input name="telefone" type="tel" required>
                    </div> 
                    <div>
                        <label for="email_id">E-mail:</label>
                        <input id="email_id" name="email" type="email">
                    </div>
                    <div>
                        <label for="data_nasc_id">Data de nascimento:</label>
                        <input id="data_nasc_id" name="data_nasc" type="date">
                    </div>

                    <fieldset>
                        <legend>Endereço</legend>
                    
                        <div>
                            <label for="logradouro_id">Logradouro:</label>
                            <input id="logradouro_id" name="logradouro" type="text">
                        </div>
                        <div>
                            <label for="cidade_id">Cidade-UF</label>
                            <input id="cidade_id" name="cidade" type="text">
                        </div>
                        <div>
                            <label for="numero_id">Número:</label>
                            <input id="numero_id" name="numero" type="number">
                        </div>
                    </fieldset>

                    </fieldset>

                    <fieldset>
                        <legend>Resumo</legend>
                        <div>
                            <label for="resumo_id">Fale sobre você :</label>
                            <textarea id="resumo_id" name="resumo" rows="4" cols="50"></textarea>
                        </div>
                        <fieldset> 
                            <legend>Nível desejado</legend>
                            <div>
                                <input id="nivel_estagio_id" name="nivel" type="radio" value="estagio">
                                <label for="nivel_estagio_id">Estagio</label>
                            </div>
                            <div>   
                                <input id="nivel_junior_id" name="nivel" type="radio" value="junior">
                                <label for="nivel_junior_id">Júnior</label>
                            </div>
                        </fieldset>
                    </fieldset>

                    <fieldset>
                        <legend>Tecnologias que domina</legend>
                        <div>
                            <input id="tec_html_id" name="tecnologias" type="checkbox" value="html">
                            <label for="tec_html_id">HTML</label>
                        </div>
                        <div>
                            <input id="tec_css_id" name="tecnologias" type="checkbox" value="css">
                            <label for="tec_css_id">CSS</label>
                        </div>
                        <div>
                            <input id="tec_js_id" name="tecnologias" type="checkbox" value="js">
                            <label for="tec_js_id">JavaScript</label>   
                        </div> 
                    </fieldset>

                    <fieldset>
                        <legend>Grau de instrução</legend>
                        <div>
                            <label for="escolaridade_id">Escolaridade:</label>
                            <select id="escolaridade_id" name="escolaridade">
                                <option value="medio">Médio</option>
                                <option value="superior">Superior</option>
                                <option value="pós">Pós</option>
                            </select>
                        </div>
                    </fieldset>

                    <div>
                        <button type="reset">Limpar dados</button>   
                        <button type="submit">Enviar candidato</button>   
                    </div>

                </form>
            </section>
        </main>
        <footer>
            <p>Todos os direitos reservados &copy;</p>
        </footer>
    </body>
</html>
