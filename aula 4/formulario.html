<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Encomende os doces para seu evento</title>
</head>

<body>
    <h1>🍰 Encomende os doces para o seu evento</h1>
    <main>
        <section>
            <form action="https://postman-echo.com/post" method="post" enctype="multipart/form-data">
                <p>Preencha o formulário abaixo para realizar a sua encomenda:</p>
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <div>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div>
                        <label for="sobrenome">Sobrenome:</label>
                        <input type="text" id="sobrenome" name="sobrenome" required>
                    </div>

                    <div>
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" required placeholder="(XX) XXXXX-XXXX">

                    </div>

                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div>
                        <label for="data_evento">Data do Evento:</label>
                        <input type="date" id="data_evento" name="data_evento" required>
                    </div>
                    
                    <br>
                    
                    <fieldset>
                        <legend>Qual é o evento?</legend>
                        
                        <div>
                            <label for="tipo_de_evento">Tipo de Evento:</label>
                            <select id="tipo_de_evento" name="tipo_de_evento">
                                <option value="Selecionar">Selecionar</option>
                                <option value="Aniversário">Aniversário</option>
                                <option value="Casamento">Casamento</option>
                                <option value="Formatura">Formatura</option>
                                <option value="Festa">Festa</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>

                    </fieldset>
                    <br>
                    
                    <fieldset>
                        <legend>Doces para encomenda</legend>
                        <div>
                            <input id="Brigadeiro" name="Brigadeiro" type="checkbox" value="brigadeiro">
                            <label for="Brigadeiro">Brigadeiro</label>
                            <input id="Quantidade_Brigadeiro" name="Quantidade_Brigadeiro" type="number" min="0" placeholder="Quantidade">
                        </div>

                        <div>
                            <input id="Beijinho" name="Beijinho" type="checkbox" value="beijinho">
                            <label for="Beijinho">Beijinho</label>
                            <input id="Quantidade_Beijinho" name="Quantidade_Beijinho" type="number" min="0" placeholder="Quantidade">
                        </div>

                        <div>
                            <input id="Ninho_com_avela" name="Ninho_com_avela" type="checkbox" value="ninho_com_avela">
                            <label for="Ninho_com_avela">Ninho com Avelã</label>
                            <input id="Quantidade_Ninho_com_avela" name="Quantidade_Ninho_com_avela" type="number" min="0" placeholder="Quantidade">
                        </div>

                        <div>
                            <input id="oreo" name="oreo" type="checkbox" value="oreo">
                            <label for="oreo">Oreo</label>
                            <input id="Quantidade_oreo" name="Quantidade_oreo" type="number" min="0" placeholder="Quantidade">
                        </div>

                        <div>
                            <input id="Brownie" name="Brownie" type="checkbox" value="brownie">
                            <label for="Brownie">Brownie</label>
                            <input id="Quantidade_Brownie" name="Quantidade_Brownie" type="number" min="0" placeholder="Quantidade">
                        </div>

                        <div>
                            <input id="Cupcake" name="Cupcake" type="checkbox" value="cupcake">
                            <label for="Cupcake">Cupcake</label>
                            <input id="Quantidade_Cupcake" name="Quantidade_Cupcake" type="number" min="0" placeholder="Quantidade">
                        </div>

                    </fieldset>
                    <br>
                    
                    <fieldset>
                        <legend>Sabor do bolo</legend>
                        <div>
                            <input id="Brigadeiro" name="Sabor_Bolo" type="radio" value="brigadeiro">
                            <label for="Brigadeiro">Brigadeiro</label>
                        </div>

                        <div>
                            <input id="Chocolate_e_maracuja" name="Sabor_Bolo" type="radio"
                                value="chocolate_e_maracuja">
                            <label for="Chocolate_e_maracuja">Chocolate e Maracujá</label>
                        </div>

                        <div>
                            <input id="Ninho_e_morango" name="Sabor_Bolo" type="radio" value="ninho_e_morango">
                            <label for="Ninho_e_morango">Ninho e Morango</label>
                        </div>

                        <div>
                            <input id="Ninho_com_avela" name="Sabor_Bolo" type="radio" value="ninho_com_avela">
                            <label for="Ninho_com_avela">Ninho com Avelã</label>
                        </div>

                        <div>
                            <input id="Ninho_e_chocolate" name="Sabor_Bolo" type="radio" value="ninho_e_chocolate">
                            <label for="Ninho_e_chocolate">Ninho e Chocolate</label>
                        </div>

                        <div>
                            <input id="Doce_de_leite" name="Sabor_Bolo" type="radio" value="doce_de_leite">
                            <label for="Doce_de_leite">Doce de Leite</label>
                        </div>
                    </fieldset>
                    <br>

                    <fieldset>
                        <legend>Tipo de recebimento</legend>
                        <div>
                            <input id="Retirada_na_loja" name="Tipo_de_recebimento" type="radio" value="retirada">
                            <label for="Retirada_na_loja">Retirada na Loja</label>
                        </div>

                        <div>
                            <input id="Entrega" name="Tipo_de_recebimento" type="radio" value="entrega">
                            <label for="Entrega">Entrega</label>
                        </div>

                    </fieldset>
                    <br>
                    <fieldset>
                        <legend>Endereço da Entrega</legend>
                        <div>
                            <label for="CEP">CEP:</label>
                            <input id="CEP" name="CEP" type="text" pattern="[0-9]{5}-[0-9]{3 }" placeholder="00000-000">
                        </div>

                        <div>
                            <label for="Rua">Rua:</label>
                            <input id="Rua" name="Rua" type="text">
                        </div>

                        <div>
                            <label for="Numero">Número:</label>
                            <input id="Numero" name="Numero" type="number">
                        </div>

                        <div>
                            <label for="Bairro">Bairro:</label>
                            <input id="Bairro" name="Bairro" type="text">
                        </div>

                        <div>
                            <label for="Cidade">Cidade:</label>
                            <input id="Cidade" name="Cidade" type="text">
                        </div>

                    </fieldset>
                    <br>
                    <input type="submit" value="Encomendar">
            </form>
        </section>
    </main>
</body>

</html>
